<!doctype html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dokończ zamówienie — APEX ULTRA | smartwatch4u.store</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   APEX ULTRA — smartwatch4u.store
   Design tokens
   ============================================================ */

:root{
  --bg:            #FAFAF9;
  --bg-alt:        #F1F0EE;
  --ink:           #15141A;
  --ink-soft:      #3A3942;
  --steel:         #6E6E76;
  --steel-light:   #9A9AA1;
  --hairline:      #E6E5E2;
  --white:         #FFFFFF;
  --accent:        #FF5722;
  --accent-dark:   #D9481A;
  --accent-tint:   #FFF0EA;
  --gold:          #F2B705;
  --success:       #1D7A4C;

  --font-display:  'Space Grotesk', 'Helvetica Neue', Arial, sans-serif;
  --font-body:     'Inter', 'Helvetica Neue', Arial, sans-serif;
  --font-mono:     'JetBrains Mono', 'Courier New', monospace;

  --container: 1120px;
  --radius-s: 6px;
  --radius-m: 14px;
  --radius-l: 28px;
}

*, *::before, *::after{ box-sizing:border-box; }
html{ scroll-behavior:smooth; }
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
img{ max-width:100%; display:block; }
a{ color:inherit; text-decoration:none; }
ul{ margin:0; padding:0; list-style:none; }
h1,h2,h3,h4{ font-family:var(--font-display); margin:0; letter-spacing:-0.02em; }
p{ margin:0; }
button{ font-family:inherit; cursor:pointer; }

.wrap{
  max-width:var(--container);
  margin:0 auto;
  padding:0 28px;
}

:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:3px;
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.01ms !important; transition-duration:0.01ms !important; scroll-behavior:auto !important; }
}

/* ---------- Announcement bar ---------- */
.announce{
  background:var(--ink);
  color:var(--white);
  text-align:center;
  font-family:var(--font-mono);
  font-size:12.5px;
  letter-spacing:0.06em;
  padding:9px 14px;
}
.announce b{ color:var(--accent); font-weight:600; }

/* ---------- Header ---------- */
.site-header{
  position:sticky; top:0; z-index:50;
  background:rgba(250,249,249,0.86);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--hairline);
}
.site-header .wrap{
  display:flex; align-items:center; justify-content:space-between;
  height:76px;
}
.logo{
  font-family:var(--font-display);
  font-weight:700;
  font-size:20px;
  letter-spacing:-0.01em;
  display:flex; align-items:center; gap:8px;
}
.logo .dot{
  width:8px; height:8px; border-radius:50%;
  background:var(--accent);
  display:inline-block;
}
.header-cta{
  display:inline-flex; align-items:center; gap:10px;
  background:var(--ink); color:var(--white);
  padding:11px 20px; border-radius:999px;
  font-size:14px; font-weight:600;
  transition:transform .18s ease, background .18s ease;
}
.header-cta:hover{ background:var(--accent-dark); transform:translateY(-1px); }
.header-price{ font-family:var(--font-mono); color:var(--steel-light); font-size:13px; display:none; }
@media (min-width:640px){ .header-price{ display:inline; } }

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:10px;
  padding:17px 30px;
  border-radius:999px;
  font-weight:600; font-size:15.5px;
  border:1px solid transparent;
  transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
}
.btn-primary{
  background:var(--accent); color:var(--white);
  box-shadow:0 10px 24px -10px rgba(255,87,34,0.55);
}
.btn-primary:hover{ background:var(--accent-dark); transform:translateY(-2px); box-shadow:0 14px 30px -10px rgba(217,72,26,0.55); }
.btn-dark{ background:var(--ink); color:var(--white); }
.btn-dark:hover{ background:#000; transform:translateY(-2px); }
.btn-ghost{ background:transparent; color:var(--ink); border-color:var(--hairline); }
.btn-ghost:hover{ border-color:var(--ink); }
.btn-block{ width:100%; }
.btn-lg{ padding:19px 36px; font-size:16.5px; }

/* ---------- Hero ---------- */
.hero{
  padding:64px 0 40px;
  overflow:hidden;
}
.hero .wrap{
  display:grid;
  grid-template-columns:1fr;
  gap:48px;
  align-items:center;
}
@media (min-width:920px){
  .hero .wrap{ grid-template-columns:1.05fr 1fr; gap:32px; }
}
.eyebrow{
  display:inline-flex; align-items:center; gap:8px;
  font-family:var(--font-mono);
  font-size:12px; letter-spacing:0.08em; text-transform:uppercase;
  color:var(--accent-dark);
  background:var(--accent-tint);
  padding:7px 14px; border-radius:999px;
  margin-bottom:22px;
}
.hero h1{
  font-size:clamp(38px, 5.6vw, 60px);
  line-height:1.03;
  font-weight:700;
}
.hero h1 em{
  font-style:normal;
  color:var(--accent);
}
.hero-sub{
  margin-top:20px;
  font-size:18px;
  color:var(--steel);
  max-width:46ch;
}
.hero-price-row{
  margin-top:32px;
  display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
}
.price-now{
  font-family:var(--font-mono); font-weight:700;
  font-size:40px; color:var(--ink);
}
.price-was{
  font-family:var(--font-mono);
  font-size:19px; color:var(--steel-light);
  text-decoration:line-through;
}
.price-save{
  font-family:var(--font-mono);
  font-size:13px; font-weight:600;
  color:var(--success);
  background:#EAF6EF; padding:5px 10px; border-radius:999px;
}
.hero-actions{ margin-top:30px; display:flex; gap:14px; flex-wrap:wrap; }
.hero-meta{
  margin-top:26px; display:flex; gap:22px; flex-wrap:wrap;
  font-size:13.5px; color:var(--steel);
}
.hero-meta span{ display:inline-flex; align-items:center; gap:7px; }
.hero-meta svg{ flex:none; }

.hero-visual{
  position:relative;
  display:flex; align-items:center; justify-content:center;
  background:radial-gradient(circle at 50% 38%, #FFFFFF 0%, var(--bg-alt) 72%);
  border-radius:var(--radius-l);
  padding:38px;
  min-height:380px;
}
.hero-visual img{
  width:100%; max-width:420px;
  filter:drop-shadow(0 30px 50px -18px rgba(20,20,25,0.35));
}
.hero-ring-badge{
  position:absolute;
  bottom:18px; left:18px;
  background:var(--white);
  border-radius:999px;
  box-shadow:0 14px 30px -14px rgba(20,20,25,0.3);
  padding:12px 16px 12px 12px;
  display:flex; align-items:center; gap:10px;
}
@media (max-width:640px){ .hero-ring-badge{ left:10px; bottom:10px; padding:9px 13px 9px 9px; } }

/* ---------- Signature: dial-ring stat ---------- */
.ring-stat{
  --ring-size:64px;
  width:var(--ring-size); height:var(--ring-size);
  border-radius:50%;
  flex:none;
  background:conic-gradient(var(--accent) calc(var(--pct,80)*1%), var(--hairline) 0);
  display:flex; align-items:center; justify-content:center;
}
.ring-stat::after{
  content:'';
  width:calc(var(--ring-size) - 11px); height:calc(var(--ring-size) - 11px);
  border-radius:50%; background:var(--white);
  position:absolute;
  top:50%; left:50%;
  transform:translate(-50%,-50%);
}
.ring-stat .ring-inner{
  position:relative; z-index:2;
  font-family:var(--font-mono); font-weight:700; font-size:13px; color:var(--ink);
  text-align:center; line-height:1.1;
}
.ring-stat{ position:relative; }
.ring-label{ font-size:12.5px; color:var(--steel); line-height:1.3; }
.ring-label b{ display:block; color:var(--ink); font-size:13.5px; }

/* ---------- Section shell ---------- */
.section{ padding:88px 0; }
.section-alt{ background:var(--bg-alt); }
.section-dark{ background:var(--ink); color:var(--white); }
.section-head{
  max-width:640px;
  margin:0 auto 52px;
  text-align:center;
}
.section-head.left{ margin-left:0; text-align:left; }
.section-title{
  font-size:clamp(28px, 3.6vw, 40px);
  font-weight:700;
}
.section-kicker{
  font-family:var(--font-mono);
  font-size:12px; letter-spacing:0.08em; text-transform:uppercase;
  color:var(--accent);
  display:block; margin-bottom:14px;
}
.section-dark .section-kicker{ color:var(--accent); }
.section-desc{
  margin-top:16px; color:var(--steel); font-size:16.5px;
}
.section-dark .section-desc{ color:#B9B9BF; }

/* ---------- Trust ring strip ---------- */
.trust-strip{
  display:grid; gap:28px;
  grid-template-columns:repeat(2,1fr);
}
@media (min-width:720px){ .trust-strip{ grid-template-columns:repeat(4,1fr); } }
.trust-item{
  display:flex; align-items:center; gap:14px;
  background:var(--white);
  border:1px solid var(--hairline);
  border-radius:var(--radius-m);
  padding:20px;
}

/* ---------- Feature grid ---------- */
.feature-grid{
  display:grid; gap:22px;
  grid-template-columns:1fr;
}
@media (min-width:720px){ .feature-grid{ grid-template-columns:repeat(3,1fr); } }
.feature-card{
  background:var(--white);
  border:1px solid var(--hairline);
  border-radius:var(--radius-m);
  padding:30px 26px;
  transition:box-shadow .2s ease, transform .2s ease;
}
.feature-card:hover{ box-shadow:0 20px 40px -24px rgba(20,20,25,0.25); transform:translateY(-3px); }
.feature-icon{
  width:46px; height:46px; border-radius:12px;
  background:var(--accent-tint); color:var(--accent-dark);
  display:flex; align-items:center; justify-content:center;
  margin-bottom:18px;
}
.feature-card h3{ font-size:18px; margin-bottom:9px; }
.feature-card p{ color:var(--steel); font-size:15px; }

/* ---------- Specs ---------- */
.specs-wrap{
  display:grid; gap:0;
  grid-template-columns:1fr;
  border-top:1px solid var(--hairline);
}
.spec-row{
  display:grid; grid-template-columns:1fr 1fr;
  gap:12px;
  padding:20px 4px;
  border-bottom:1px solid var(--hairline);
  align-items:baseline;
}
.spec-row dt{ color:var(--steel); font-size:14.5px; }
.spec-row dd{ margin:0; font-family:var(--font-mono); font-weight:600; font-size:15.5px; text-align:right; }

/* ---------- Gallery ---------- */
.gallery{
  display:grid; gap:18px;
  grid-template-columns:repeat(2,1fr);
}
@media (min-width:720px){ .gallery{ grid-template-columns:repeat(4,1fr); } }
.gallery-tile{
  background:var(--white);
  border:1px solid var(--hairline);
  border-radius:var(--radius-m);
  aspect-ratio:1/1;
  display:flex; align-items:center; justify-content:center;
  padding:22px;
}
.gallery-tile img{ width:100%; }

/* ---------- Reviews ---------- */
.reviews-summary{
  display:flex; align-items:center; gap:22px; flex-wrap:wrap;
  justify-content:center;
  margin-bottom:46px;
}
.reviews-score{
  font-family:var(--font-mono); font-weight:700; font-size:44px;
}
.stars{ color:var(--gold); font-size:18px; letter-spacing:2px; }
.reviews-count{ color:var(--steel); font-size:14px; }

.review-grid{
  display:grid; gap:18px;
  grid-template-columns:1fr;
}
@media (min-width:680px){ .review-grid{ grid-template-columns:repeat(2,1fr); } }
@media (min-width:1000px){ .review-grid{ grid-template-columns:repeat(3,1fr); } }

.review-card{
  background:var(--white);
  border:1px solid var(--hairline);
  border-radius:var(--radius-m);
  padding:24px;
}
.review-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.review-name{ font-weight:600; font-size:14.5px; }
.review-badge{
  font-family:var(--font-mono); font-size:10.5px;
  color:var(--success); background:#EAF6EF;
  padding:3px 8px; border-radius:999px;
}
.review-stars{ color:var(--gold); font-size:14px; margin-bottom:10px; letter-spacing:1.5px; }
.review-text{ color:var(--ink-soft); font-size:14.5px; }
.review-date{ margin-top:14px; color:var(--steel-light); font-size:12.5px; }

/* ---------- FAQ ---------- */
.faq-item{
  border-bottom:1px solid var(--hairline);
}
.faq-item summary{
  list-style:none; cursor:pointer;
  display:flex; align-items:center; justify-content:space-between;
  padding:22px 4px; font-weight:600; font-size:16px;
}
.faq-item summary::-webkit-details-marker{ display:none; }
.faq-item summary::after{
  content:'+'; font-family:var(--font-mono); font-size:20px; color:var(--accent);
  transition:transform .2s ease;
}
.faq-item[open] summary::after{ transform:rotate(45deg); }
.faq-item p{ padding:0 4px 22px; color:var(--steel); font-size:15px; max-width:70ch; }

/* ---------- CTA banner ---------- */
.cta-banner{
  border-radius:var(--radius-l);
  background:var(--ink);
  color:var(--white);
  padding:56px 40px;
  text-align:center;
}
.cta-banner h2{ font-size:clamp(26px,4vw,36px); }
.cta-banner p{ margin-top:14px; color:#B9B9BF; }
.cta-banner .btn{ margin-top:28px; }

/* ---------- Sticky order bar ---------- */
.sticky-bar{
  position:fixed; left:0; right:0; bottom:0; z-index:60;
  background:rgba(21,20,26,0.94);
  backdrop-filter:blur(10px);
  color:var(--white);
  padding:14px 20px;
  transform:translateY(120%);
  transition:transform .3s ease;
}
.sticky-bar.show{ transform:translateY(0); }
.sticky-bar .wrap{
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:0;
}
.sticky-bar-info{ display:flex; flex-direction:column; }
.sticky-bar-info small{ color:#B9B9BF; font-size:12px; }
.sticky-bar-info strong{ font-family:var(--font-mono); font-size:18px; }

/* ---------- Footer ---------- */
.site-footer{
  background:var(--ink); color:#D6D6DA;
  padding:64px 0 30px;
}
.footer-grid{
  display:grid; gap:36px;
  grid-template-columns:1fr;
}
@media (min-width:780px){ .footer-grid{ grid-template-columns:1.4fr 1fr 1fr; } }
.footer-logo{ color:var(--white); font-family:var(--font-display); font-weight:700; font-size:19px; }
.footer-desc{ margin-top:14px; color:#9C9CA3; font-size:14.5px; max-width:36ch; }
.footer-col h4{ color:var(--white); font-size:13px; text-transform:uppercase; letter-spacing:0.06em; margin-bottom:16px; }
.footer-col li{ margin-bottom:11px; }
.footer-col a{ color:#B9B9BF; font-size:14.5px; }
.footer-col a:hover{ color:var(--white); }
.footer-bottom{
  margin-top:52px; padding-top:26px; border-top:1px solid rgba(255,255,255,0.08);
  display:flex; flex-wrap:wrap; gap:14px; align-items:center; justify-content:space-between;
  font-size:13px; color:#8B8B93;
}
.footer-payments{ display:flex; gap:10px; font-family:var(--font-mono); font-size:12px; }
.footer-payments span{ border:1px solid rgba(255,255,255,0.15); padding:4px 9px; border-radius:6px; }

/* ---------- Simple/legal pages ---------- */
.legal-hero{
  padding:70px 0 40px;
  border-bottom:1px solid var(--hairline);
}
.legal-hero .section-kicker{ margin-bottom:16px; }
.legal-hero h1{ font-size:clamp(30px,4.2vw,44px); }
.legal-updated{ margin-top:14px; color:var(--steel); font-size:14px; font-family:var(--font-mono); }
.legal-body{ padding:56px 0 100px; }
.legal-body .wrap{ max-width:760px; }
.legal-body h2{ font-size:22px; margin-top:44px; margin-bottom:14px; }
.legal-body h2:first-child{ margin-top:0; }
.legal-body p{ color:var(--ink-soft); margin-bottom:14px; }
.legal-body ul{ margin-bottom:14px; }
.legal-body li{ color:var(--ink-soft); margin-bottom:9px; padding-left:22px; position:relative; }
.legal-body li::before{
  content:''; position:absolute; left:0; top:9px;
  width:6px; height:6px; border-radius:50%; background:var(--accent);
}
.legal-body strong{ color:var(--ink); }
.legal-toc{
  background:var(--white); border:1px solid var(--hairline); border-radius:var(--radius-m);
  padding:22px 26px; margin-bottom:10px;
}
.legal-toc h4{ font-size:13px; text-transform:uppercase; letter-spacing:0.06em; color:var(--steel); margin-bottom:12px; }
.legal-toc a{ display:block; padding:6px 0; font-size:14.5px; color:var(--ink-soft); }
.legal-toc a:hover{ color:var(--accent); }

/* ---------- Order page ---------- */
.order-shell{
  padding:56px 0 100px;
}
.order-grid{
  display:grid; gap:40px;
  grid-template-columns:1fr;
}
@media (min-width:920px){ .order-grid{ grid-template-columns:1fr 0.9fr; } }
.order-card{
  background:var(--white); border:1px solid var(--hairline); border-radius:var(--radius-l);
  padding:34px;
}
.order-summary{
  background:var(--white); border:1px solid var(--hairline); border-radius:var(--radius-l);
  padding:30px; height:fit-content;
}
.order-product{ display:flex; gap:16px; align-items:center; padding-bottom:22px; border-bottom:1px solid var(--hairline); }
.order-product img{ width:92px; background:radial-gradient(circle, #fff 0%, var(--bg-alt) 75%); border-radius:14px; padding:10px; }
.order-product h4{ font-size:15.5px; margin-bottom:4px; }
.order-product span{ color:var(--steel); font-size:13.5px; }
.order-line{ display:flex; justify-content:space-between; padding:14px 0; font-size:14.5px; color:var(--steel); border-bottom:1px solid var(--hairline); }
.order-line.total{ color:var(--ink); font-weight:700; font-family:var(--font-mono); font-size:17px; border-bottom:none; }
.order-badges{ margin-top:22px; display:flex; flex-direction:column; gap:10px; font-size:13.5px; color:var(--steel); }
.order-badges span{ display:flex; align-items:center; gap:9px; }

.field{ margin-bottom:18px; }
.field label{ display:block; font-size:13.5px; font-weight:600; margin-bottom:8px; }
.field input, .field select{
  width:100%; padding:14px 15px;
  border:1px solid var(--hairline); border-radius:10px;
  font-family:var(--font-body); font-size:15px;
  background:var(--bg-alt);
  transition:border-color .15s ease, background .15s ease;
}
.field input:focus, .field select:focus{ background:var(--white); border-color:var(--accent); outline:none; }
.field-row{ display:grid; gap:16px; grid-template-columns:1fr; }
@media (min-width:560px){ .field-row{ grid-template-columns:1fr 1fr; } }
.field-hint{ font-size:12.5px; color:var(--steel-light); margin-top:6px; }
.form-error{
  display:none; background:#FCEBEA; color:#B3261E; border-radius:10px;
  padding:12px 14px; font-size:13.5px; margin-bottom:18px;
}

/* ---------- Thank you page ---------- */
.thanks-shell{ padding:90px 0 110px; text-align:center; }
.thanks-icon{
  width:78px; height:78px; margin:0 auto 26px;
  border-radius:50%; background:var(--accent-tint);
  display:flex; align-items:center; justify-content:center;
  color:var(--accent-dark);
}
.thanks-shell h1{ font-size:clamp(28px,4.2vw,42px); }
.thanks-shell p.lead{ margin-top:16px; color:var(--steel); font-size:17px; max-width:52ch; margin-left:auto; margin-right:auto; }
.thanks-order-id{
  margin:30px auto 0; display:inline-block;
  font-family:var(--font-mono); background:var(--bg-alt);
  padding:10px 18px; border-radius:999px; font-size:14px; color:var(--ink-soft);
}
.thanks-steps{
  margin:52px auto 0; max-width:720px;
  display:grid; gap:18px; grid-template-columns:1fr;
  text-align:left;
}
@media (min-width:720px){ .thanks-steps{ grid-template-columns:repeat(3,1fr); } }
.thanks-step{
  background:var(--white); border:1px solid var(--hairline); border-radius:var(--radius-m);
  padding:22px;
}
.thanks-step .num{
  font-family:var(--font-mono); color:var(--accent); font-weight:700; font-size:13px; margin-bottom:10px; display:block;
}
.thanks-step h4{ font-size:15px; margin-bottom:6px; }
.thanks-step p{ color:var(--steel); font-size:13.5px; }

</style>
